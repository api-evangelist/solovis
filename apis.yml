name: Solovis
description: >-
  Solovis is a multi-asset investment analytics and portfolio management
  software platform for institutional investors, including endowments,
  foundations, pension plans, outsourced CIOs (OCIOs), and family offices. It
  aggregates data across public and private asset classes into a single
  dashboard for portfolio modeling, performance analysis, risk analytics, and
  reporting. Core products include Portfolio Analytics, Risk Analytics, Predict
  (performance and risk prediction for asset allocation), Risk Pro (factor-based
  risk analytics, formerly Venn Pro), and Analyst Services for outsourced data
  capture and portfolio data aggregation. Solovis became part of Nasdaq's
  investment intelligence business following its 2020 acquisition. The platform
  is delivered as a private, authenticated SaaS accessed through a client login;
  as of this enrichment pass it publishes no public developer API, documentation
  portal, OpenAPI specification, or `/.well-known/` discovery surface. The host
  api.solovis.com exists but is fully authentication-gated (HTTP 401) with no
  public specification.
